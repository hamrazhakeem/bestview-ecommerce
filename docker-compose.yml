version: '3.8'

services:
  web:
    build: .
    container_name: bestview-app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    networks:
      - bestview-network
      
  db:
    image: postgres:13
    container_name: bestview-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    networks: 
      - bestview-network

volumes:
  postgres_data: 

networks:
  bestview-network:
